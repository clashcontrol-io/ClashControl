name: "Contribute a country pack"
description: "Add a country's building-code thresholds, national data standard, coordinate system or name words (regulations/*.json)."
title: "[regulations] Add <region> country pack"
labels: ["contribution", "type:regulation"]
body:
  - type: markdown
    attributes:
      value: |
        A country pack is pure JSON: building-code thresholds (`engines`), a national data
        standard (`dataQuality`), coordinate systems / 3D tiles (`geo`), name words (`naming`) and
        classification tables (`classifications`) — every section is optional. Thresholds are
        safety-relevant (door widths, ramp slopes, turning clearances), so this contribution path is
        deliberately stricter than a translation:

        - A **source citation** is required — the specific regulation text/article your values
          come from, not just "the building code." Data standards and tables cite their own source.
        - Every submitted pack starts `verified: false` and shows an "(unverified)" label in the app
          until a maintainer or a domain-knowledgeable reviewer confirms the values.
        - Only include values you can actually cite — leave a section or key out rather than guess.
        - Patterns are plain strings (max 200 characters, no nested quantifiers, backreferences or
          lookbehind); URLs must be https on the allow-list in `country-pack-core.js`.

        1. Copy [`regulations/_template.json`](../../blob/main/regulations/_template.json), delete
           the sections you can't cite and fill in the rest.
        2. Fill in the fields below and drag your finished `.json` file into the "Your regulation
           pack file" box.
        3. See [`regulations/README.md`](../../blob/main/regulations/README.md) for the full format
           and requirements.
  - type: input
    id: region
    attributes:
      label: "Region code"
      description: "e.g. \"jp\", \"jp-tokyo\" — must match the `region` field in your file."
      placeholder: "jp"
    validations:
      required: true
  - type: input
    id: regionname
    attributes:
      label: "Region name"
      description: "Full country/region name — must match the `name` field in your file."
    validations:
      required: true
  - type: input
    id: contributor
    attributes:
      label: "Your name or GitHub handle"
      description: "Credited in the pack and the resulting PR."
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: "Source citation"
      description: "The specific regulation text/article your values come from — must match the `source` field in your file."
    validations:
      required: true
  - type: textarea
    id: file
    attributes:
      label: "Your country pack file"
      description: "Drag and drop your `<region>.json` file directly into this box — do not paste it as text."
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: "Confirmation"
      options:
        - label: "These values are cited from a real, checkable source, and I understand unverifiable submissions will not be merged."
          required: true
