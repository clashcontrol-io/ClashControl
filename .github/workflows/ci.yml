name: CI

# Runs the node:test suite. No build step; the only install is the
# test-only packages a job needs (three and web-ifc, pinned to the CDN versions; jszip and
# playwright for the browser checks), never saved to package.json.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Manual trigger for branches where the synchronize event got lost
  # (happens occasionally — saw it on #589). Keep this permanently; it's
  # also useful when re-running after a flaky upstream.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Tests that check against the real libraries, pinned to the versions
      # index.html loads from the CDN: three.js (tests/viewer-*.test.js,
      # tests/geo-bounds.test.js) and web-ifc (the fixture / stream-order /
      # non-physical-element tests parse real IFC).
      - name: Install test-only dependencies
        run: npm install --no-save three@0.180.0 web-ifc@0.0.77

      - name: Run tests
        run: npm test

  # Extracts the main inline <script> from index.html (scripts/lint-inline.js,
  # preserving line numbers) and lints it with ESLint 9, restricted to
  # no-undef (error — catches real "X is not defined" runtime crashes like
  # colour-by mode's _isGhostMat bug) and react-hooks/rules-of-hooks (error —
  # catches real conditional-hook bugs). exhaustive-deps runs as a
  # non-failing warning. eslint itself isn't a runtime dependency of the app
  # (see CLAUDE.md — no build tooling for index.html), so it's installed
  # fresh here rather than checked into package.json's main dependencies.
  lint-inline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install lint tooling
        run: npm install --no-save eslint@9 eslint-plugin-react-hooks@5 globals@17

      - name: Lint extracted inline script
        run: npm run lint:inline

  # // @ts-check over the standalone UMD modules (cc-runtime.js, *-core.js,
  # project-codec.js, …) — non-strict + strictNullChecks, JSDoc-typed, no
  # build step: the files ship exactly as written.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install type-check tooling
        run: npm install --no-save typescript@6 @types/node@22

      - name: Type-check standalone modules
        run: npm run typecheck

  # Headless-Chromium smoke: boots the real app, loads tests/fixtures/
  # smoke-clash.ifc through the real web-ifc WASM pipeline, runs real
  # clash detection, asserts the two crossing walls clash. Catches the
  # whole class of "main script throws / loader broke / engine returns
  # nothing" regressions that node:test can't see.
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1 jszip@3.10.1
          npx playwright install --with-deps chromium

      - name: Run browser smoke test
        run: node tests/browser/smoke.mjs

      - name: Run storage metadata check (sizes from index keys, v3 upgrade)
        run: node tests/browser/storage-metadata.mjs

      - name: Run project pages check (autosave writes what changed, reloads identical, legacy migrates)
        run: node tests/browser/project-pages.mjs

      - name: Run shared folder check (per-user change files, idle reads nothing, conflicts shown on both pages, migration)
        run: node tests/browser/shared-folder.mjs

      - name: Run exact cache-restore check (restored geometry + clashes identical to a fresh load)
        run: node tests/browser/cache-restore-exact.mjs

      - name: Run windowed conflict list scroll-memoization check
        run: node tests/browser/windowed-list-scroll-memo.mjs

      - name: Run storey-scope truncated-scan check
        run: node tests/browser/storey-scope-truncated.mjs

      - name: Run country-pack resolution check (IFC-neutral vs auto-activated pack)
        run: node tests/browser/country-packs.mjs

      - name: Run BCF clipping-plane round trip (section box + plane, BCF 2.1 and 3.0)
        run: node tests/browser/bcf-clipping.mjs

      - name: Run storey units (mm + m federation — plan cut, labels, sheet / DXF in metres)
        run: node tests/browser/storey-units.mjs

  # Path filter for the heavier differential probes below. index.html is the
  # whole single-file app (loader, engine, UI all in one file), so this can't
  # narrow down to "only the IFC loader changed" the way a multi-file repo
  # could — but it does skip the ~250+ round-trip cost of these jobs on PRs
  # that only touch docs/backend/tests and never touch app code at all.
  changes:
    runs-on: ubuntu-latest
    outputs:
      app-code: ${{ steps.filter.outputs.app-code }}
      pressure: ${{ steps.filter.outputs.pressure }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whether app code changed
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          else
            CHANGED=$(git diff --name-only HEAD^ HEAD 2>/dev/null || echo "")
          fi
          echo "Changed files:"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^(index\.html|addons/|engine/|clash-discipline-core\.js|cc-runtime\.js|occlusion-core\.js|tests/browser/occlusion-culling\.mjs)'; then
            echo "app-code=true" >> "$GITHUB_OUTPUT"
          else
            echo "app-code=false" >> "$GITHUB_OUTPUT"
          fi
          # the pressure harness also depends on the clash-pipeline cores,
          # the safety flags / storage modules and its own sources
          if echo "$CHANGED" | grep -qE '^(index\.html|addons/|engine/|cc-runtime\.js|[a-z-]+-core\.js|project-codec\.js|safety-migrations\.js|tests/pressure/|tests/fixtures/generate-building-ifc\.js|tests/_oracle-exact\.js)'; then
            echo "pressure=true" >> "$GITHUB_OUTPUT"
          else
            echo "pressure=false" >> "$GITHUB_OUTPUT"
          fi

  # Differential correctness probes, promoted from local-only scripts per the
  # 2026-07-17 large-model plan review's Phase 1 ask: these already existed
  # (ifc-worker-fallback-differential.mjs written for the worker-split
  # prerequisite; wasm-sweep-differential.mjs written per explicit
  # "test it locally before and after" instruction for the Rust/WASM sweep,
  # see MEMORY.md) but only ran ad hoc on a developer's machine, never in CI.
  browser-differential:
    needs: changes
    if: needs.changes.outputs.app-code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium

      - name: Run IFC worker vs. main-thread-fallback fingerprint differential
        run: node tests/browser/ifc-worker-fallback-differential.mjs

      - name: Progressive preview + parallel IFC loading (display-only preview, identical models)
        run: node tests/browser/progressive-load.mjs

      - name: Run WASM vs. JS broad-phase sweep differential
        run: node tests/browser/wasm-sweep-differential.mjs

      - name: Run office fixture WASM vs. JS narrow-phase differential + known-count lock
        run: node tests/browser/office-clash-parity.mjs

      - name: First-run narrow phase — main / main-js / pool-1 / pool-3 / pool-js give the identical clash list
        run: node tests/browser/first-run-cost.mjs

      - name: Section planes follow a building rotated in plan
        run: node tests/browser/section-plane-alignment.mjs

      - name: Section gizmos — one plane gizmo at the cut, model-fitted outline, screen-constant handles, token colours
        run: node tests/browser/section-gizmo.mjs

      - name: View cube one-click square views; no pivot dot / cube arrows
        run: node tests/browser/viewcube-click.mjs

      - name: Measure snap on BatchedMesh (vertex / edge), never to section-clipped geometry
        run: node tests/browser/measure-snap.mjs

      - name: IfcSpace rooms load with geometry, hidden by default, never steal picks or clashes
        run: node tests/browser/spaces.mjs

      - name: IfcGrid lines load (worker = fallback), draw, and locate clashes ("Grid B-1 · Level 0")
        run: node tests/browser/grid-lines.mjs

      - name: Occlusion culling on vs off renders identical pixels (every view)
        run: node tests/browser/occlusion-culling.mjs

  # Randomized pressure test (tests/pressure/): the fast tier — 24 seeded
  # pairwise combinations of load path, rules, role exclusion, edits, display
  # filters, engine path, cancel, failure injection, storage knobs and
  # round-trips over the synthetic federation, each checked against the
  # exact oracle and the invariants I1–I16. Fixed seed so a PR sees the same
  # combos every time; the nightly workflow (pressure-nightly.yml) explores
  # new seeds. Bounded: each combo has its own timeout, the job a hard cap.
  # A failure uploads the report + replayable repro files
  # (node tests/pressure/run.mjs --combo <repro.json>).
  browser-pressure:
    needs: changes
    if: needs.changes.outputs.pressure == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CC_PRESSURE_OUT: ${{ runner.temp }}/cc-pressure
      CC_PRESSURE_COMBO_TIMEOUT_MS: '300000'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium

      - name: Pressure test, fast tier (seed 1)
        run: node tests/pressure/run.mjs --tier fast --seed 1

      - name: Upload pressure report + repros
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pressure-fast-seed-1
          path: ${{ runner.temp }}/cc-pressure
          if-no-files-found: ignore
